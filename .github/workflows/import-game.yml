name: Import verified complete game

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-game.yml'

permissions:
  contents: write

concurrency:
  group: complete-game-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and verify the reviewed game archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/releases/assets/691420699" \
            --header 'Accept: application/octet-stream' \
            > "$RUNNER_TEMP/game.zip"
          printf '%s  %s\n' \
            '3d5b5ec391a044b11bda5905b3ed4f16699963f023fd67e39f94836d0dfab4c8' \
            "$RUNNER_TEMP/game.zip" | sha256sum --check --status

      - name: Restore the complete source and media tree
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import stat
          import zipfile

          staging = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-game'
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'game.zip') as archive:
              files = [info for info in archive.infolist() if not info.is_dir()]
              assert len(files) == 237, 'Unexpected file count'
              assert sum(info.filename.endswith('.mp4') for info in files) == 41, 'Unexpected video count'
              for info in archive.infolist():
                  path = pathlib.PurePosixPath(info.filename)
                  assert path.parts and path.parts[0] == 'baiyi-zhiguailu'
                  assert not path.is_absolute() and '..' not in path.parts
                  assert '.git' not in path.parts
                  assert not stat.S_ISLNK(info.external_attr >> 16)
              archive.extractall(staging)
          source = staging / 'baiyi-zhiguailu'
          for path in source.iterdir():
              if path.name == '.github':
                  continue
              destination = pathlib.Path.cwd() / path.name
              if path.is_dir():
                  shutil.copytree(path, destination, dirs_exist_ok=True)
              else:
                  shutil.copy2(path, destination)
          PY

      - name: Build and verify the complete game
        run: |
          npm run build
          npm run build:cloud
          npm test
          npm run test:cloud
          npm run check:privacy

      - name: Commit the imported game using a non-personal identity
        run: |
          set -euo pipefail
          git config user.name 'Game Release Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete sanitized game with all 41 videos'
            git push origin HEAD:main
          fi
          printf 'Imported the reviewed game and all 41 videos. Replace this temporary importer with the read-only game checks workflow.\n' >> "$GITHUB_STEP_SUMMARY"
